name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feature/**"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -v

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (validation only, not pushed)
        run: docker build -t student-ml-api:ci-${{ github.sha }} .

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 5000:5000 student-ml-api:ci-${{ github.sha }}
          sleep 3
          curl --fail http://localhost:5000/health
          docker stop smoke
